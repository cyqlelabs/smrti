name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter's result: which versions break is the point
      # of the matrix, and stopping at the first failure hides the pattern.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # hatch-vcs derives the version from tags, so the full history is needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # FastEmbed pulls a ~120MB ONNX model on first embed; without this every
      # job on every run re-downloads it from HuggingFace. The cache only sees
      # it once FASTEMBED_CACHE_PATH points somewhere other than the temp dir
      # FastEmbed defaults to.
      - run: echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"
      # ~/.cache/smrti holds what weights.py derives from the downloads: the
      # external-data form of each ONNX model. It was missing here, so every
      # job rebuilt it — and building it means parsing the 1.1GB GLiNER
      # encoder into the heap, which ONNX Runtime does twice.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
            ~/.cache/smrti
          key: models-${{ runner.os }}-v3
      # The CPU build of torch, before anything can resolve the GPU one.
      #
      # NER still runs on ONNX Runtime, but the decision model does not: laya
      # declares nothing but "torch>=2.0.0", and on Linux pip answers that
      # with the CUDA build. Measured, that install is 5.6 GB, of which 3.2 GB
      # is NVIDIA runtime libraries and 897 MB is triton — on a runner with no
      # GPU, ~14 GB of disk, and a pip cache holding the same wheels again. It
      # is what killed this job: the suite was OOM-killed mid-run (exit 137)
      # and took the runner with it. Installing the CPU wheel first leaves
      # laya's dependency already satisfied and the whole environment near
      # 600 MB.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[openai]" pytest pytest-cov
      # Convert the weights in a process that then exits, so the spike above
      # is not paid inside the one that also holds the models, the databases
      # and the whole suite. pytest then memory-maps a form already on disk.
      # The 3.13 job was OOM-killed mid-suite (exit 137) and lost its runner
      # a second time on the next run; this is the largest allocation in the
      # job and the only one that is pure setup.
      - run: |
          python -c "
          from smrti.core.embed import get_embedding_provider
          from smrti.extraction.ner import get_ner
          get_embedding_provider().embed('warm')
          get_ner().extract('Alice works at Acme in Amsterdam.')
          "
      - run: pytest tests/ -q --cov=smrti --cov-report=xml
      # One upload is enough; the other interpreters cover the same lines.
      - if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          # Forked PRs cannot read the token; a missing upload must not fail CI.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # Catches a broken sdist or wheel at review time rather than on the tag
      # push, where the same build gates publishing to PyPI.
      - run: twine check dist/*
