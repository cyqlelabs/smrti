[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram-memory"
version = "0.1.0"
description = "AtomSpace-inspired memory + personality engine for AI agents"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.0",
    "fastembed>=0.4.0",
    "rapidfuzz>=3.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
engram = "engram.cli:app"

[project.optional-dependencies]
openai = ["openai>=1.0"]
gliner = ["gliner>=0.2.0"]
ollama = ["ollama>=0.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]
