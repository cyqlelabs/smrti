<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>smrti-town</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="game-container"></div>

  <!-- UI Overlays -->
  <div id="ui-topbar" class="ui-panel hidden">
    <div id="topbar-clock"></div>
    <div id="topbar-treasury"></div>
    <div id="topbar-population"></div>
    <div id="topbar-speed"></div>
  </div>

  <div id="ui-sidebar" class="ui-panel hidden">
    <div id="sidebar-close" class="panel-close">&times;</div>
    <div id="sidebar-content"></div>
  </div>

  <div id="ui-eventlog" class="ui-panel hidden">
    <div id="eventlog-title">Events</div>
    <div id="eventlog-entries"></div>
  </div>

  <div id="ui-controls" class="ui-panel hidden">
    <button id="btn-pause" title="Pause">&#9646;&#9646;</button>
    <button id="btn-play" title="Play">&#9654;</button>
    <button id="btn-skip" title="Skip week">&#9193;</button>
  </div>

  <div id="ui-toolbar" class="ui-panel hidden">
    <div id="toolbar-title">Build</div>
    <div id="toolbar-items"></div>
  </div>

  <div id="ui-council-overlay" class="ui-overlay hidden">
    <div class="overlay-card overlay-wide">
      <h2>Council Meeting</h2>
      <div id="council-debate"></div>
      <div id="council-proposal"></div>
      <div id="council-actions"></div>
    </div>
  </div>

  <div id="ui-petitions" class="ui-panel hidden">
    <div class="panel-header">
      <span>Petitions</span>
      <span id="petitions-close" class="panel-close">&times;</span>
    </div>
    <div id="petitions-list"></div>
  </div>

  <div id="ui-economy" class="ui-panel hidden">
    <div class="panel-header">
      <span>Economy</span>
      <span id="economy-close" class="panel-close">&times;</span>
    </div>
    <div id="economy-content"></div>
  </div>

  <div id="ui-settings" class="ui-overlay hidden">
    <div class="overlay-card">
      <h2>Settings</h2>
      <div id="settings-form"></div>
      <div class="overlay-actions">
        <button id="settings-save" class="btn-primary">Save</button>
        <button id="settings-cancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="ui-mayor-select" class="ui-overlay hidden">
    <div class="overlay-card overlay-wide">
      <h2>Choose Your Mayor</h2>
      <div id="mayor-candidates"></div>
    </div>
  </div>

  <div id="ui-council-reveal" class="ui-overlay hidden">
    <div class="overlay-card overlay-wide">
      <h2>Council Formed</h2>
      <div id="council-members"></div>
      <div class="overlay-actions">
        <button id="council-begin" class="btn-primary">Begin</button>
      </div>
    </div>
  </div>

  <div id="ui-generating" class="ui-overlay hidden">
    <div class="overlay-card">
      <div id="generating-spinner" class="spinner"></div>
      <p id="generating-message">Generating world...</p>
      <p id="generating-hint" class="hint-text"></p>
    </div>
  </div>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Game scripts (order matters) -->
  <script src="js/constants.js"></script>
  <script src="js/state.js"></script>
  <script src="js/plugins/IsometricPlugin.js"></script>
  <script src="js/rendering/terrain.js"></script>
  <script src="js/rendering/buildings.js"></script>
  <script src="js/rendering/agents.js"></script>
  <script src="js/rendering/daynight.js"></script>
  <script src="js/rendering/particles.js"></script>
  <script src="js/rendering/speech.js"></script>
  <script src="js/ui/topbar.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/eventlog.js"></script>
  <script src="js/ui/controls.js"></script>
  <script src="js/ui/toolbar.js"></script>
  <script src="js/ui/petitions.js"></script>
  <script src="js/ui/economy.js"></script>
  <script src="js/ui/council.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/tick/processor.js"></script>
  <script src="js/ws.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/OpeningScene.js"></script>
  <script src="js/scenes/TownScene.js"></script>
  <script src="js/scenes/GameOverScene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
